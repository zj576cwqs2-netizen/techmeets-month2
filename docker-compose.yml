services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./myapp:/var/www/html
      - ./myapp/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - fluentd
    networks:
      - app-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        tag: nginx.access

  app:
    build:
      context: ./myapp
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./myapp:/var/www/html
    environment:
      - DB_HOST=db
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db
      - fluentd
    networks:
      - app-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: fluentd:24224
        fluentd-async: "true"
        tag: app.laravel

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      - db
    networks:
      - app-network

  fluentd:
    build:
      context: ./myapp/docker/fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./myapp/docker/fluentd/conf:/fluentd/etc
      - fluentd-logs:/fluentd/log
    networks:
      - app-network

volumes:
  db-data:
  fluentd-logs:

networks:
  app-network:
    driver: bridge
