<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match app.**>
  @type file
  path /fluentd/log/app
  append true
  <format>
    @type json
  </format>
  <buffer time>
    timekey 1d
    timekey_use_utc true
  </buffer>
</match>

<match nginx.**>
  @type file
  path /fluentd/log/nginx
  append true
  <format>
    @type json
  </format>
  <buffer time>
    timekey 1d
    timekey_use_utc true
  </buffer>
</match>

<match **>
  @type file
  path /fluentd/log/other
  append true
</match>
