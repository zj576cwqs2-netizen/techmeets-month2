services:
  nginx-staging:
    image: nginx:latest
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-staging
    networks:
      - app-network-staging

  app-staging:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db-staging
      - DB_DATABASE=laravel_staging
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db-staging
    networks:
      - app-network-staging

  db-staging:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: laravel_staging
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-staging-data:/var/lib/mysql
    networks:
      - app-network-staging

volumes:
  db-staging-data:

networks:
  app-network-staging:
    driver: bridge